# dedup.exclude.yaml -- functions the draw filter (tools/dedup/draw.py) must refuse, reason `exclude-list`.
# Restricted YAML read by draw.py with the stdlib: `#` comment lines, `entries:` (or `entries: []` when empty), then
# one entry per line as `  - {json object}` (a JSON object is YAML flow syntax). Keys, all strings:
#   alias    slus | rockx5
#   vram     8 hex digits, no 0x (as inventory.jsonl)
#   name     the inventory name
#   reason   why it must not be drawn
#   date     YYYY-MM-DD the entry was added
#   reprobe  argv run by shlex split, cwd repo root, no shell, 120 s timeout; non-zero exit = still refuses (live),
#            exit 0 = stale -> draw.py prints `draw: stale exclude <alias> <vram> <reason>` and refuses to run (G38)
# Example:
#   - {"alias": "slus", "vram": "80012E0C", "name": "game_80012E0C", "reason": "...", "date": "2026-10-05", "reprobe": "python3 tools/dedup/carve.py plan slus 80012E0C"}
